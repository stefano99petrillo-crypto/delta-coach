<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">
<meta name="description" content="Delta Coach: allenamento, alimentazione, abitudini e progressi con il tuo personal trainer.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Delta Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}</style>
<title>Delta Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* Delta Coach v2 · nero e oro, come le schede PDF. Una colonna su carta chiara; un blocco nero per schermata con l'azione in oro; barra di navigazione nera sospesa. */
:root{
  --bg:#F2F2EF; --surface:#FFFFFF; --fg:#0C0C0B; --muted:#5F5E58; --line:#E3E2DC; --soft:#E9E8E2;
  --ink:#0A0A0A; --ink-fg:#FFFFFF; --ink-muted:#B5B2A6; --ink-line:#2E2C26;
  --accent:#D4AF37; --accent-ink:#0A0A0A; --accent-soft:#F5ECCB; --accent-deep:#5E4800; --accent-tx:#7A5E00; --chart:#8A6A00;
  --hot:#B93221; --hot-soft:#FBE6E1;
  --ok:#1F6E5A; --ok-soft:#E1EFEA; --warn:#A04E08; --warn-soft:#FBE7D4;
  --p:#2F5BA8; --c:#C2671A; --f:#8E3D8A;
  --strong:#0C0C0B; --strong-fg:#FFFFFF; --strong-line:transparent;
  --bar:#0C0C0B; --dock:#0A0A0A; --dock-fg:#FFFFFF; --dock-muted:#A19D90; --dock-line:#0A0A0A;
  --g-bg:#0A0A0A; --g-panel:#161614; --g-line:#2B2A25; --g-fg:#F3F1EA; --g-muted:#A5A297; --g-lime:#D4AF37; --g-orange:#FF8A4C; --g-track:#26241D; --g-hl:#1F1B0E; --g-hl-line:#4A3F17;
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-card:20px; --r-hero:24px; --r-ctl:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A0A0A; --surface:#161614; --fg:#F3F1EA; --muted:#A5A297; --line:#2B2A25; --soft:#1E1D19;
  --ink:#1D1B15; --ink-fg:#FFFFFF; --ink-muted:#BDB9AB; --ink-line:#3B372B;
  --accent:#D4AF37; --accent-ink:#0A0A0A; --accent-soft:#2F2810; --accent-deep:#EBD07A; --accent-tx:#E2C257; --chart:#D4AF37;
  --hot:#F07A63; --hot-soft:#3A1813;
  --ok:#74CFAE; --ok-soft:#14302A; --warn:#F2A766; --warn-soft:#3A2512;
  --p:#7FA6EC; --c:#F0A35E; --f:#D08ACB;
  --strong:#34322A; --strong-fg:#F3F1EA; --strong-line:#47443A;
  --bar:#D4AF37; --dock:#1A1916; --dock-fg:#FFFFFF; --dock-muted:#A19D90; --dock-line:#34322B; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#161614; --fg:#F3F1EA; --muted:#A5A297; --line:#2B2A25; --soft:#1E1D19;
  --ink:#1D1B15; --ink-fg:#FFFFFF; --ink-muted:#BDB9AB; --ink-line:#3B372B;
  --accent:#D4AF37; --accent-ink:#0A0A0A; --accent-soft:#2F2810; --accent-deep:#EBD07A; --accent-tx:#E2C257; --chart:#D4AF37;
  --hot:#F07A63; --hot-soft:#3A1813;
  --ok:#74CFAE; --ok-soft:#14302A; --warn:#F2A766; --warn-soft:#3A2512;
  --p:#7FA6EC; --c:#F0A35E; --f:#D08ACB;
  --strong:#34322A; --strong-fg:#F3F1EA; --strong-line:#47443A;
  --bar:#D4AF37; --dock:#1A1916; --dock-fg:#FFFFFF; --dock-muted:#A19D90; --dock-line:#34322B; color-scheme:dark; }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent}
body.gamebody{background:var(--g-bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.screen{flex:1;padding:20px 16px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.screen.notab{padding-bottom:28px}
.boot{padding:48px 16px;color:var(--muted);text-align:center}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-size:17px;font-weight:700}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.avatar{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.soft{background:var(--soft);border-color:transparent}
.card.ink{background:var(--ink);color:var(--ink-fg);border-color:transparent}
.card.ink .muted,.card.ink .eyebrow{color:var(--ink-muted)}
button.card{font:inherit;color:inherit;text-align:left;width:100%}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row.start{justify-content:flex-start}
.stack{display:flex;flex-direction:column;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg);text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn.dark{background:var(--fg);color:var(--bg);border-color:transparent;font-weight:700}
.btn.out{border:2px solid var(--fg);background:transparent;font-weight:700}
.btn.sm{min-height:40px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-tx);padding:0 8px}
.card.ink .btn{background:transparent;color:var(--ink-fg);border-color:var(--ink-line)}
.card.ink .btn.light{background:var(--ink-fg);color:#141514;border-color:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{color:var(--accent-tx);font-weight:600;text-decoration:none;background:none;border:0;padding:0;min-height:36px;display:inline-flex;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;background:var(--soft);color:var(--fg);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.acc{background:var(--accent-soft);color:var(--accent-deep)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:transparent}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .title{font-weight:700}
.li button.liwrap{all:unset;display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer;min-height:44px}
.li button.liwrap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:10px;height:10px;border-radius:5px;flex:0 0 auto;background:var(--muted)}
.dot.red{background:var(--accent)} .dot.amber{background:#D99A2B} .dot.green{background:var(--ok)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:13px;font-weight:600}
.input,select.input,textarea.input{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;width:100%;min-width:0}
textarea.input{padding:10px 12px;min-height:84px;resize:vertical;line-height:1.4}
.input.big{min-height:56px;font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:.08em;border:2px solid var(--fg)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45}
.check input{width:20px;height:20px;margin:0;flex:0 0 auto;accent-color:var(--fg)}
.bar{height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.bar>span{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--fg)}
.bar.over>span{background:var(--accent)}
.pkg{display:grid;gap:4px}
.pkg span{height:8px;border-radius:4px;background:var(--line)}
.pkg span.on{background:var(--fg)}
.big-num{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.delta-up{color:var(--ok);font-weight:600;font-size:13px}
.delta-down{color:var(--accent-tx);font-weight:600;font-size:13px}
.empty{padding:16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:14px;line-height:1.5}
.busy{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;background:var(--soft);font-weight:600}
.busy::before{content:"";width:16px;height:16px;border-radius:8px;border:2px solid var(--muted);border-top-color:transparent;animation:spin 0.8s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.filebox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;border:2px dashed var(--line);border-radius:16px;text-align:center;cursor:pointer;background:var(--surface)}
.filebox input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.filebox.has{border-color:var(--ok);background:var(--ok-soft)}
details.card summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:32px}
details.card summary::-webkit-details-marker{display:none}
.prose{white-space:pre-wrap;line-height:1.5;font-size:14px}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar-in{max-width:560px;margin:0 auto;display:grid}
.tab{min-height:62px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{color:var(--fg);font-weight:700}
.tabbar.g{background:var(--g-bg);border-top-color:var(--g-line)}
.tabbar.g .tab{color:var(--g-muted)} .tabbar.g .tab[aria-current="page"]{color:var(--g-lime)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,10,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
/* workout */
.prog{display:grid;gap:4px;grid-auto-flow:column;grid-auto-columns:1fr}
.prog span{height:6px;border-radius:3px;background:var(--line)}
.prog span.done{background:var(--fg)} .prog span.cur{background:var(--accent)}
.setrow{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center}
.setrow .input{min-height:44px;font-family:var(--mono);font-weight:600;padding:0 10px}
.setrow.head{font-size:12px;color:var(--muted);font-weight:600}
.okbtn{width:44px;height:44px;border-radius:22px;border:2px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center}
.okbtn.on{background:var(--ok);border-color:transparent;color:#fff}
.boxes{display:flex;gap:8px}
.box{flex:1;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--bg);min-width:0}
.box.acc{background:var(--accent-soft);color:var(--accent-deep)}
.exnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.exnav button{flex:0 0 auto;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap}
.exnav button[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:transparent}
/* nutrizione */
.macro{display:grid;grid-template-columns:86px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:14px}
.macro .bar{height:10px}
.macro.p .bar>span{background:var(--p)} .macro.c .bar>span{background:var(--c)} .macro.f .bar>span{background:var(--f)}
.food{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.food:last-child{border-bottom:0}
.mi{display:grid;grid-template-columns:110px minmax(0,1fr) 84px;gap:8px;align-items:center;font-size:13px}
.mi .bar{height:6px}
/* game */
.game{background:var(--g-bg);color:var(--g-fg)}
.game .muted{color:var(--g-muted)}
.g-label{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--g-muted);text-transform:uppercase}
.g-panel{border:1px solid var(--g-line);padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.g-panel .c1,.g-panel .c2{position:absolute;width:14px;height:14px}
.g-panel .c1{top:-1px;left:-1px;border-top:2px solid var(--g-lime);border-left:2px solid var(--g-lime)}
.g-panel .c2{bottom:-1px;right:-1px;border-bottom:2px solid var(--g-lime);border-right:2px solid var(--g-lime)}
.g-track{height:8px;background:var(--g-track);position:relative}
.g-track>span{position:absolute;left:0;top:0;bottom:0}
.g-stat{display:grid;grid-template-columns:116px minmax(0,1fr) 44px;gap:10px;align-items:center}
.g-item{background:var(--g-panel);border:1px solid var(--g-line);padding:12px 14px;display:flex;align-items:center;gap:12px;color:var(--g-fg);font:inherit;text-align:left;width:100%}
.g-item.done .gt{color:var(--g-muted);text-decoration:line-through}
.g-box{width:22px;height:22px;border:2px solid #5A5F58;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.g-box.on{background:var(--g-lime);border-color:var(--g-lime);color:#0E0F0E}
.game .link{color:var(--g-lime)}
.game .btn{background:transparent;color:var(--g-fg);border-color:var(--g-line)}
.switch{width:44px;height:26px;border-radius:13px;background:var(--line);border:0;position:relative;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:var(--surface);transition:left .15s}
.switch[aria-checked="true"]{background:var(--fg)} .switch[aria-checked="true"]::after{left:21px}
.game .switch{background:var(--g-track)} .game .switch[aria-checked="true"]{background:var(--g-lime)} .game .switch::after{background:var(--g-bg)}
.legend-row{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-bottom:1px solid #1E201D}
.legend-row.me{background:var(--g-hl);outline:1px solid var(--g-hl-line);padding:10px;margin:0 -10px}
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px 6px 0}
table.t td{padding:10px 8px 10px 0;border-top:1px solid var(--line)}
.hgrid{display:grid;grid-template-columns:44px repeat(6,minmax(0,1fr));gap:4px;font-size:12px}
.hgrid button{min-height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:11px}
.hgrid button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:transparent}
/* v3: foto, micronutrienti, obiettivi, clienti */
.hidinput{position:relative;overflow:hidden}
.clirow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:inherit;font:inherit;cursor:pointer;min-width:0}
.clirow:last-child{border-bottom:0}
.cav{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:0 0 auto;position:relative;font-size:15px;letter-spacing:.02em}
.cav i{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:7px;border:2px solid var(--surface)}
.pkmini{width:56px;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pkmini .bar{width:100%}
.fthumb{width:64px;height:86px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.foodbtn{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:stretch}
.mthumb{width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--soft)}
.mthumb img{width:100%;height:100%;object-fit:cover;display:block}
.statlink{display:flex;flex-direction:column;gap:6px;width:100%;background:none;border:0;padding:6px 0;text-align:left;color:inherit;font:inherit;cursor:pointer}
button.statlink-g{width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.addfood{display:flex;gap:8px}
.addmain{flex:1;min-height:68px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:12px;padding:0 16px;text-align:left;font:inherit}
.addcam{width:76px;min-height:68px;border-radius:16px;background:var(--fg);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:0 0 auto}
.mbars{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;height:56px;align-items:end}
.mbars span{position:relative;height:100%;display:flex;align-items:flex-end;background:var(--soft);border-radius:3px}
.mbars span.none{opacity:.4}
.nbars{display:grid;gap:6px;height:150px;align-items:stretch}
.nbars.fitti{gap:2px}
.nbar{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer;height:100%}
span.nbar{cursor:default}
.nbar:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.nbar .col{position:relative;flex:1;display:flex;align-items:flex-end;background:var(--soft);border-radius:5px;min-height:0}
